<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Background Blur</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.blur-box {
    width: 300px;
    height: 200px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 22px;
}
</style>
</head>

<body>

<div class="blur-box">
    Blur Background
</div>

</body>
</html>
